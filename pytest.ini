[pytest]
DJANGO_SETTINGS_MODULE = archive.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    performance: Performance tests
    slow: Slow-running tests (>10s)
    cache: Cache-related tests
    query: Database query tests
addopts =
    --verbose
    --tb=short
    --strict-markers
    --durations=10
    --reuse-db
testpaths = tests
